name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: test
          POSTGRES_DB: loan_engine_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:test@localhost:5432/loan_engine_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ingest/requirements-dev.txt
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Load schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infrastructure/sql/schema.sql
      - name: Lint (ruff)
        run: ruff check ingest/
      - name: Tests (pytest, incl. integration)
        run: pytest ingest/tests -q

  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose -f docker-compose.yml config --quiet
            echo "docker-compose.yml is valid"
          else
            echo "docker-compose.yml not present yet - skipping"
          fi